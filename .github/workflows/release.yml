name: release

# Tag a commit (v<semver>) and this builds the Windows package and publishes
# it as a GitHub Release. The zip layout (a top-level dsh-helper-<ver>/ folder
# plus a .sha256) is what update_helper.py expects when applying updates.

run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('release {0}', github.ref_name) || 'build only (no release)' }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystray pillow pyinstaller

      - name: Read version from main.py
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path src/main.py -Pattern '^VERSION = ' | Select-Object -First 1
          if (-not $line) { throw "VERSION not found in main.py" }
          $version = ($line.Line -split '"')[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          "package=dsh-helper-$version" >> $env:GITHUB_OUTPUT
          "app_id=dsh-helper" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version"

      - name: Compile gate
        run: python -m py_compile src/main.py src/icons.py src/app_params.py src/template/appconfig/appconfig.py src/template/update_helper/update_helper.py src/template/paths/paths.py src/template/log_kit/log_kit.py src/template/tray_kit/tray_kit.py

      # Same chain as the local build.bat: gates + PyInstaller + release layout
      # (release\<name>-<ver>\<name>.exe, exe carries no version - naming-and-version).
      # nosmoke: the frozen smoke gate validates the real dsh.cmd, which CI
      # runners don't have - skipped here per the "CI-unavailable resource is
      # explicitly skipped, reason stated" rule (G3); local builds keep it ON.
      - name: Build release
        shell: cmd
        run: build.bat norun nopause nosmoke

      - name: Package zip (OTA layout + PE version gates)
        shell: pwsh
        run: |
          $pkg = "${{ steps.version.outputs.package }}"
          $version = "${{ steps.version.outputs.version }}"
          $appId = "${{ steps.version.outputs.app_id }}"
          $dir = "release/$pkg"
          # Stable paths: zip inner folder is the APP_ID, never the version.
          $stageRoot = Join-Path ([System.IO.Path]::GetTempPath()) "ota-stage-$pkg"
          $stage = Join-Path $stageRoot $appId
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "$dir/*" -Destination $stage -Recurse -Force
          $zip = "release/$pkg-windows-x64.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          Remove-Item $stageRoot -Recurse -Force
          # OTA layout gate + PE version gate: fail before publishing.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $tops = @($archive.Entries | ForEach-Object { ($_.FullName -split '/')[0] } | Sort-Object -Unique)
            if ($tops.Count -ne 1 -or $tops[0] -ne $appId) {
              throw "OTA layout gate: zip top-level = [$($tops -join ', ')], expected [$appId] (stable, no version)"
            }
            if (-not ($archive.Entries | Where-Object { $_.FullName -eq "$appId/dsh-helper.exe" })) {
              throw "OTA layout gate: $appId/dsh-helper.exe missing from zip"
            }
          } finally {
            $archive.Dispose()
          }
          $fv = (Get-Item "$dir/dsh-helper.exe").VersionInfo.FileVersion
          if (-not $fv -or -not $fv.StartsWith($version)) {
            throw "PE version gate: FileVersion='$fv', expected '$version' (embed via --version-file)"
          }
          Get-FileHash $zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $pkg-windows-x64.zip" } |
            Set-Content "release/$pkg-windows-x64.zip.sha256"
          Get-ChildItem release | Format-Table Name, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.package }}-windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = "${{ steps.version.outputs.package }}"
          $notes = "Windows package: unpack and run ``dsh-helper.exe``. In-app updates pick this zip up directly. See README.md for usage."
          gh release create $tag "release/$pkg-windows-x64.zip" "release/$pkg-windows-x64.zip.sha256" `
            --title "$pkg" --notes $notes
