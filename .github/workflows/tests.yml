name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil pystray pillow

      - name: Compile check
        run: python -m py_compile src/main.py src/icons.py src/template/appconfig/appconfig.py src/template/update_helper/update_helper.py src/template/paths/paths.py src/template/log_kit/log_kit.py src/template/tray_kit/tray_kit.py

      - name: Import check (module-level config seed + menu data must not blow up)
        run: python -c "import sys; sys.path.insert(0, 'src'); import main; print('import OK, VERSION =', main.VERSION)"

      # The whole tests/ suite was reachable ONLY from build.bat, i.e. only from the
      # tag-triggered release workflow - so a fix to a gate could not be verified without
      # cutting a release (found while fixing exactly that in local-speak2text/reme-helper).
      # Run it on every push, with the same suite-wide data-dir pin build.bat uses: that pin
      # is the F11/D12 "belt and braces" - a test file that forgets its own pin must still
      # not touch the machine's real data root.
      # The failing file is named via an annotation, because step logs need sign-in while
      # run-page annotations are public text.
      - name: Test suite (tests/test_*.py)
        shell: pwsh
        env:
          DSH_HELPER_DATA_DIR: ${{ github.workspace }}\build\test-data
        run: |
          $fail = @()
          Get-ChildItem tests/test_*.py | Sort-Object Name | ForEach-Object {
            Write-Host "== $($_.Name) =="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $fail += $_.Name }
          }
          if ($fail.Count -gt 0) {
            Write-Host ("::error title=tests failed::" + ($fail -join '%0A'))
            exit 1
          }

      - name: Update logic check
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from template.update_helper.update_helper import _version_is_newer as v, _tag_to_version as t; assert v('1.8.0','1.7.0'); assert not v('1.7.0','1.7.0'); assert t('v1.8.0')=='1.8.0'; print('update logic OK')"
